name: orcaslicer_mobile
description: OrcaSlicer Mobile - Android app for AD5X 3D printer control
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.1.2
  web_socket_channel: ^2.4.3
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  google_fonts: ^6.1.0
  file_picker: ^6.1.1
  mdns: ^1.0.0
  permission_handler: ^11.2.0
  cached_network_image: ^3.3.0
  fl_chart: ^0.66.0
  three_d_view: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
